<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>醫藥先鋒：藥師任務地圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --parch:#F3EAD8; --parch2:#EADFC6; --ink:#3a3128; --ink-soft:#6b5d4c;
  --green:#4A7C59; --green-d:#3a6347; --green-l:#66a077;
  --red:#D84A3B; --red-d:#bd3a2c;
  --blue:#3B82C4; --blue-d:#2e6ba6;
  --gold:#F5B429; --gold-d:#d99512;
  --wood:#8B6D4F;
  --panel:rgba(255,255,255,.74);
  --panel-solid:#fffdf8;
  --line:rgba(74,124,89,.28);
  --shadow:0 10px 30px rgba(90,70,40,.16);
  --radius:22px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1200px 600px at 15% -10%, #fff6e6 0%, transparent 55%),
    radial-gradient(1000px 700px at 110% 10%, #f6ecd6 0%, transparent 50%),
    linear-gradient(180deg,var(--parch) 0%, var(--parch2) 100%);
  background-attachment:fixed;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.eng{font-family:"Fredoka",sans-serif;letter-spacing:.02em}

/* ---- top bar ---- */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:14px;
  padding:12px 20px;
  background:linear-gradient(180deg,rgba(255,253,248,.92),rgba(255,253,248,.72));
  backdrop-filter:blur(10px);
  border-bottom:2px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;color:var(--green-d)}
.brand .cross{width:26px;height:26px;border-radius:7px;background:var(--red);position:relative;box-shadow:0 3px 8px rgba(216,74,59,.35)}
.brand .cross:before,.brand .cross:after{content:"";position:absolute;background:#fff;border-radius:2px}
.brand .cross:before{width:12px;height:4px;left:7px;top:11px}
.brand .cross:after{height:12px;width:4px;top:7px;left:11px}
.nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.nav button{
  font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;
  padding:9px 15px;border-radius:12px;border:2px solid transparent;
  background:rgba(74,124,89,.10);color:var(--green-d);transition:.15s;
}
.nav button:hover{background:rgba(74,124,89,.2)}
.nav button.active{background:var(--green);color:#fff;box-shadow:0 4px 12px rgba(74,124,89,.3)}

.wrap{max-width:1000px;margin:0 auto;padding:26px 18px 80px}
.view{display:none;animation:fade .35s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---- panels ---- */
.panel{
  position:relative;background:var(--panel);backdrop-filter:blur(6px);
  border:2px solid rgba(255,255,255,.7);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:26px;margin-bottom:22px;overflow:hidden;
}
.panel:before,.panel:after{content:"";position:absolute;width:16px;height:16px;opacity:.5;
  background:radial-gradient(circle at 50% 50%,var(--red) 0 40%,transparent 42%)}
.panel:before{top:12px;left:12px}
.panel:after{top:12px;right:12px}
.panel-title{display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;margin:0 0 6px}
.panel-title h2{margin:0;font-size:22px;font-weight:900;color:var(--ink)}
.panel-title .sub{font-size:12px;color:var(--ink-soft);letter-spacing:.14em;text-transform:uppercase}
.stage-tag{display:inline-block;font-size:13px;font-weight:700;color:#fff;background:var(--blue);
  padding:3px 12px;border-radius:20px;margin-bottom:10px}

/* ---- big draw buttons ---- */
.btn{font-family:inherit;font-weight:700;cursor:pointer;border:none;border-radius:16px;
  transition:transform .12s, box-shadow .12s, filter .12s;color:#fff;position:relative}
.btn:active{transform:translateY(2px)}
.btn-lg{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  font-size:19px;padding:16px 20px;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.btn-role{background:linear-gradient(180deg,var(--green-l),var(--green));box-shadow:0 6px 0 var(--green-d)}
.btn-case{background:linear-gradient(180deg,#f6c04a,var(--gold));color:#5a3d00;box-shadow:0 6px 0 var(--gold-d)}
.btn-role:hover,.btn-case:hover{filter:brightness(1.05)}
.btn-ghost{background:rgba(255,255,255,.6);color:var(--ink-soft);border:2px solid var(--line);
  font-size:13px;font-weight:700;padding:8px 14px;border-radius:12px;box-shadow:none;cursor:pointer}
.btn-ghost:hover{background:#fff}
.hint{text-align:center;color:var(--ink-soft);font-size:13px;margin:6px 0 16px}

/* star selector */
.stars{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:6px 0 18px}
.star-btn{font-family:inherit;cursor:pointer;border:2px solid transparent;border-radius:14px;
  padding:14px 8px;font-size:17px;font-weight:700;background:var(--blue);color:#fff;
  box-shadow:0 4px 0 var(--blue-d);transition:.12s;letter-spacing:2px}
.star-btn:hover{filter:brightness(1.06)}
.star-btn.sel{background:var(--green);box-shadow:0 4px 0 var(--green-d);transform:translateY(1px)}
.star-btn.special{background:#8256b5;box-shadow:0 4px 0 #6a3f9c;letter-spacing:0;font-size:15px}
.star-btn.special.sel{background:var(--green);box-shadow:0 4px 0 var(--green-d)}
.pool-row{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:6px}

/* section divider inside draw */
.draw-sec+.draw-sec{margin-top:24px;padding-top:22px;border-top:2px dashed var(--line)}

.footer-reset{text-align:center;margin-top:18px}

/* 首頁遊戲介紹 */
.intro-hero{text-align:center;margin-bottom:6px}
.intro-hero .cn{font-size:28px;font-weight:900;color:var(--ink);letter-spacing:1px}
.intro-hero .tag{color:var(--ink-soft);font-size:14px;margin-top:4px}
.rules-block{margin-top:14px}
.rules-block .rh{font-weight:900;color:var(--green-d);font-size:14px;margin:12px 0 5px;display:flex;align-items:center;gap:7px}
.rules-block .rh:before{content:"";width:5px;height:15px;background:var(--green);border-radius:3px;display:inline-block}
.rules-block ul{margin:0;padding-left:20px}
.rules-block li{font-size:13.5px;line-height:1.7;color:var(--ink);margin-bottom:3px}
.role-intro{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-top:14px}
.role-intro .ri{background:#fff;border:2px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 4px 12px rgba(90,70,40,.1)}
.role-intro .ri img{width:100%;aspect-ratio:.7;object-fit:cover;display:block}
.role-intro .ri .rb{padding:10px 12px}
.role-intro .ri .rn{font-weight:900;font-size:15px}
.role-intro .ri .re{font-family:"Fredoka",sans-serif;font-size:11px;color:var(--ink-soft);margin-bottom:5px}
.role-intro .ri .rd{font-size:12.5px;line-height:1.6;color:var(--ink-soft)}
/* 首頁角色：按鈕 + 展開面板 */
.role-block{margin-top:12px}
.role-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.role-tab{font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;padding:9px 18px;border-radius:22px;
  border:2px solid var(--line);background:#fff;color:var(--green-d);transition:.12s}
.role-tab.on{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 3px 8px rgba(74,124,89,.3)}
.role-panel{display:flex;gap:18px;background:#fff;border:2px solid var(--line);border-radius:16px;
  padding:16px;box-shadow:0 4px 12px rgba(90,70,40,.08);animation:fade .25s ease}
.role-panel img{width:150px;flex:0 0 150px;border-radius:12px;object-fit:cover;box-shadow:var(--shadow)}
.role-panel .rp-body{flex:1}
.role-panel .rp-name{font-weight:900;font-size:18px;margin-bottom:10px;color:var(--ink)}
.role-panel .rp-name .eng{font-size:12px;color:var(--ink-soft);font-weight:500;margin-left:6px}
@media(max-width:560px){.role-panel{flex-direction:column}.role-panel img{width:100%;flex:none;max-width:220px;margin:0 auto}}
/* 後台：進入編輯器按鈕 */
.enter-editor{display:flex;justify-content:flex-end;margin-bottom:14px}
.enter-editor button{font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;color:#fff;
  background:linear-gradient(180deg,#5a9bd8,var(--blue));border:none;padding:11px 18px;border-radius:12px;
  box-shadow:0 4px 12px rgba(59,130,196,.3)}

/* ---- drawn card modal ---- */
.overlay{position:fixed;inset:0;background:rgba(58,49,40,.55);backdrop-filter:blur(3px);
  display:none;align-items:flex-start;justify-content:center;z-index:60;padding:24px 14px;overflow:auto}
.overlay.on{display:flex}
.card-pop{background:var(--panel-solid);border-radius:24px;max-width:760px;width:100%;
  box-shadow:0 24px 60px rgba(40,30,10,.4);border:3px solid #fff;overflow:hidden;animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
.card-pop-head{padding:16px 22px;display:flex;align-items:center;gap:12px;color:#fff;
  background:linear-gradient(120deg,var(--blue),var(--blue-d))}
.card-pop-head.role{background:linear-gradient(120deg,var(--green-l),var(--green-d))}
.card-pop-head .code{font-family:"Fredoka",sans-serif;font-weight:700;font-size:15px;opacity:.9}
.card-pop-head h3{margin:0;font-size:21px;font-weight:900}
.card-pop-head .close{margin-left:auto;background:rgba(255,255,255,.25);border:none;color:#fff;
  width:34px;height:34px;border-radius:10px;font-size:20px;cursor:pointer;line-height:1}
.card-pop-body{padding:22px;display:grid;grid-template-columns:1.3fr .9fr;gap:22px}
@media(max-width:640px){.card-pop-body{grid-template-columns:1fr}}
.card-img{width:100%;border-radius:16px;box-shadow:var(--shadow);display:block}
.field{margin-bottom:14px}
.field .k{font-weight:900;color:var(--green-d);font-size:14px;margin-bottom:3px}
.field .v{font-size:15px;line-height:1.7;color:var(--ink)}
.qr-box{text-align:center;background:rgba(74,124,89,.07);border:2px dashed var(--line);
  border-radius:16px;padding:16px}
.qr-box canvas,.qr-box img{margin:0 auto;border-radius:8px}
.qr-box .lbl{font-size:13px;color:var(--ink-soft);margin-top:10px;font-weight:700}
.qr-fallback{font-size:11px;word-break:break-all;color:var(--ink-soft);margin-top:8px}

/* collapsible */
.collap{border:2px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden;background:rgba(255,255,255,.5)}
.collap>summary{cursor:pointer;padding:11px 14px;font-weight:700;color:var(--blue-d);list-style:none;font-size:14px}
.collap>summary::-webkit-details-marker{display:none}
.collap>summary:before{content:"▸ ";color:var(--gold-d)}
.collap[open]>summary:before{content:"▾ "}
.collap .inner{padding:4px 16px 14px;font-size:14px;line-height:1.75;color:var(--ink-soft)}
.ref-link{color:var(--blue-d);text-decoration:underline;word-break:break-all;font-size:13px}

/* ---- student page ---- */
.student-page{max-width:640px;margin:0 auto}
.stu-hero{background:linear-gradient(120deg,var(--blue),var(--blue-d));color:#fff;
  border-radius:22px;padding:22px 24px;box-shadow:var(--shadow);margin-bottom:18px;position:relative;overflow:hidden}
.stu-hero .code{font-family:"Fredoka",sans-serif;font-weight:700;opacity:.9}
.stu-hero h1{margin:4px 0 0;font-size:26px;font-weight:900}
.stu-hero .starline{margin-top:8px;color:var(--gold);font-size:18px;letter-spacing:2px}
.stu-card{background:var(--panel-solid);border-radius:18px;box-shadow:var(--shadow);
  border:2px solid #fff;padding:22px}

/* ---- teacher backstage ---- */
.tb-section-title{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:900;
  color:var(--green-d);margin:6px 0 14px}
.tb-section-title .bar{width:5px;height:22px;background:var(--green);border-radius:3px}
.role-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.mini-card{cursor:pointer;background:var(--panel-solid);border:2px solid var(--line);border-radius:16px;
  overflow:hidden;transition:.15s;box-shadow:0 4px 12px rgba(90,70,40,.1)}
.mini-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--green-l)}
.mini-card img{width:100%;aspect-ratio:.7;object-fit:cover;display:block}
.mini-card .mc-name{padding:10px;text-align:center;font-weight:700}
.star-group{margin-bottom:20px}
.star-group h4{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--gold-d);margin:0 0 10px;font-weight:900}
.case-row{display:flex;align-items:center;gap:12px;cursor:pointer;background:var(--panel-solid);
  border:2px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:8px;transition:.12s}
.case-row:hover{border-color:var(--blue);background:#fff;transform:translateX(3px)}
.case-row .code{font-family:"Fredoka",sans-serif;font-weight:700;color:var(--blue-d);min-width:88px}
.case-row .t{font-weight:700}
.case-row .go{margin-left:auto;color:var(--ink-soft);font-size:20px}
.answer-flag{display:inline-flex;align-items:center;gap:6px;background:rgba(216,74,59,.12);
  color:var(--red-d);font-weight:700;font-size:12px;padding:3px 10px;border-radius:20px}
.tbox{background:rgba(216,74,59,.06);border:2px solid rgba(216,74,59,.28);border-radius:14px;padding:16px;margin-top:14px}
.tbox .th{font-weight:900;color:var(--red-d);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.chips{list-style:none;padding:0;margin:8px 0 0}
.chips li{padding:8px 12px;background:#fff;border-radius:10px;margin-bottom:6px;font-size:14px;line-height:1.6;border-left:4px solid var(--gold)}
.itable{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.itable th{background:#3a1a5e;color:#fff;padding:8px;text-align:left;font-weight:700}
.itable td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.sev{font-weight:900}.sev.major{color:var(--red-d)}.sev.moderate{color:var(--gold-d)}

/* 院內藥品資訊 */
.drug-sec{margin-top:16px}
.drug-sec>.head{display:flex;align-items:center;gap:8px;font-weight:900;color:var(--green-d);
  font-size:15px;margin-bottom:10px}
.drug-card{background:#fff;border:2px solid var(--line);border-left:5px solid var(--green);
  border-radius:14px;padding:14px 16px;margin-bottom:10px}
.drug-card .dname{font-weight:900;font-size:15px;color:var(--ink)}
.drug-card .den{font-family:"Fredoka",sans-serif;font-size:12px;color:var(--ink-soft);margin-bottom:8px}
.drug-card .drow{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;padding:6px 0;border-top:1px dashed var(--line)}
.drug-card .drow .dk{font-weight:700;color:var(--green-d);font-size:13px}
.drug-card .drow .dv{font-size:13.5px;line-height:1.65;color:var(--ink);white-space:pre-line}
@media(max-width:520px){.drug-card .drow{grid-template-columns:1fr}.drug-card .drow .dk{margin-bottom:-2px}}
/* 可比較藥品表格 */
.drug-compare{border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.dc-tabs{display:flex;gap:6px;overflow-x:auto;padding:10px;background:rgba(74,124,89,.08);
  border-bottom:2px solid var(--line);-webkit-overflow-scrolling:touch}
.dc-tab{flex:0 0 auto;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;
  padding:7px 14px;border-radius:20px;border:2px solid var(--line);background:#fff;color:var(--ink-soft);transition:.12s}
.dc-tab.on{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 3px 8px rgba(74,124,89,.3)}
.dc-table{width:100%;border-collapse:collapse}
.dc-table td{border-top:1px solid var(--line);padding:12px 14px;vertical-align:top}
.dc-drug{width:34%;min-width:120px;font-weight:900;color:var(--green-d);font-size:14px;background:rgba(74,124,89,.05)}
.dc-drug span{display:block;font-family:"Fredoka",sans-serif;font-weight:500;font-size:11px;color:var(--ink-soft);margin-top:3px;word-break:break-word}
.dc-val{font-size:13.5px;line-height:1.65;color:var(--ink);white-space:pre-line}
.dc-cell.empty{color:var(--ink-soft)}
/* 編輯器：勾選盒 */
.checkgrid{max-height:220px;overflow:auto;border:2px solid var(--line);border-radius:12px;
  padding:10px 12px;background:#fff;display:grid;gap:6px}
.checkgrid.cols{grid-template-columns:1fr 1fr}
.checkgrid label{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--ink);
  margin:0;font-size:14px;cursor:pointer}
.checkgrid input{width:auto}
.drug-db-item{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--line);
  border-radius:12px;padding:9px 14px;margin-bottom:7px;font-size:14px}
.drug-db-item .dn{font-weight:700}.drug-db-item .de{color:var(--ink-soft);font-family:"Fredoka",sans-serif;font-size:12px}

/* ---- editor ---- */
.ed-tabs{display:flex;gap:8px;margin-bottom:16px}
.ed-tabs button{font-family:inherit;font-weight:700;padding:8px 16px;border-radius:12px;border:2px solid var(--line);
  background:#fff;cursor:pointer;color:var(--ink-soft)}
.ed-tabs button.on{background:var(--green);color:#fff;border-color:var(--green)}
.form label{display:block;font-weight:700;font-size:14px;color:var(--green-d);margin:14px 0 5px}
.form input,.form textarea,.form select{width:100%;font-family:inherit;font-size:15px;
  padding:10px 12px;border:2px solid var(--line);border-radius:11px;background:#fff;color:var(--ink)}
.form textarea{min-height:70px;resize:vertical;line-height:1.6}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ed-list{margin-top:8px}
.ed-item{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);
  border-radius:12px;padding:10px 14px;margin-bottom:8px}
.ed-item .code{font-family:"Fredoka",sans-serif;font-weight:700;color:var(--blue-d)}
.ed-item .grow{flex:1;font-weight:700}
.ed-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.btn-save{background:var(--green);color:#fff;font-weight:700;padding:12px 22px;border:none;border-radius:12px;cursor:pointer;font-size:15px}
.btn-export{background:var(--blue);color:#fff;font-weight:700;padding:12px 22px;border:none;border-radius:12px;cursor:pointer;font-size:15px}
.btn-del{background:rgba(216,74,59,.12);color:var(--red-d);border:none;padding:7px 12px;border-radius:9px;cursor:pointer;font-weight:700;font-size:13px}
.btn-edit{background:rgba(59,130,196,.12);color:var(--blue-d);border:none;padding:7px 12px;border-radius:9px;cursor:pointer;font-weight:700;font-size:13px}
.note{background:rgba(245,180,41,.14);border:2px solid rgba(245,180,41,.4);border-radius:12px;
  padding:12px 16px;font-size:13px;line-height:1.7;color:var(--ink-soft);margin-top:14px}
.empty{text-align:center;color:var(--ink-soft);padding:40px 10px;font-size:15px}
.back-link{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--green-d);
  font-weight:700;margin-bottom:14px;background:none;border:none;font-size:15px;font-family:inherit}
</style>
</head>
<body>

<!-- data.js（若存在）優先；否則用下方內建種子資料 -->
<script>
window.__SEED__ = /*SEED_START*/{
  "config": {
    "title": "醫藥先鋒：藥師任務地圖",
    "baseUrl": "",
    "tagline": "一場關於判斷與跨單位溝通的藥師換位思考遊戲",
    "rules": [
      {
        "h": "遊戲目標",
        "items": [
          "在有限的藥費預算與藥品庫存下，靠團隊合作完成治療任務，維持「醫院健康度」不歸零。"
        ]
      },
      {
        "h": "資源與規則",
        "items": [

        "context": "病人近期抱怨胸口灼熱、胃酸逆流，醫師診斷為胃食道逆流（GERD）。",
        "rx": "醫師開立氫離子幫浦抑制劑 Esomeprazole（Nexium；耐適恩）40mg 來抑制胃酸。",
        "evidence": "PPI 與 clopidogrel 的交互作用具臨床意義：clopidogrel 是前驅藥，主要經 CYP2C19 活化；而 omeprazole、esomeprazole 等會強力抑制此酵素，可能降低 clopidogrel 的抗血小板效果，增加心肌梗塞、缺血性中風等心血管事件風險。相關指引建議：對有腸胃道出血高風險、又在使用雙重抗血小板治療的病人可用 PPI 保護腸胃，但應避免強力抑制 CYP2C19 的 PPI（如 omeprazole）。pantoprazole 因對 CYP2C19 抑制極小、與 clopidogrel 無明顯臨床交互作用而為首選。近期統合分析與隨機試驗顯示整體影響可能不大，且 PPI 能降低腸胃道出血風險。",
        "refs": [
          {
            "title": "Proton Pump Inhibitor and Clopidogrel Interaction: Fact or Fiction?",
            "url": "https://www.ovid.com/jnls/ajg/abstract/10.1038/ajg.2009.638~proton-pump-inhibitor-and-clopidogrel-interaction-fact-or"
          }
        ],
        "drugInfo": {
          "fields": [
            "中文適應症",
            "成人常用劑量說明",
            "用藥方法",
            "禁忌症",
            "貯藏方式"
          ],
          "drugs": [
            "Esomeprazole(錠劑) 40mg/Tab",
            "Pantoprazole 40mg/Vial",
            "Famotidine  20mg/Tab"
          ]
        }
      },
      "interactions": [
        {
          "drugs": "CLOPIDOGREL HYDROGEN SULFATE — ESOMEPRAZOLE MAGNESIUM",
          "sev": "Major",
          "doc": "Excellent",
          "summary": "併用可能降低 clopidogrel 活性代謝物暴露量、削弱抗血小板作用。"
        },
        {
          "drugs": "CLOPIDOGREL HYDROGEN SULFATE — ESOMEPRAZOLE SODIUM",
          "sev": "Major",
          "doc": "Excellent",
          "summary": "併用可能降低 clopidogrel 活性代謝物暴露量、削弱抗血小板作用。"
        },
        {
          "drugs": "CLOPIDOGREL HYDROGEN SULFATE — RABEPRAZOLE SODIUM",
          "sev": "Moderate",
          "doc": "Excellent",
          "summary": "併用可能降低抗血小板作用。"
        }
      ],
      "teacher": {
        "review": "實習生必須抓出 Esomeprazole 會強烈抑制 CYP2C19 酵素活性。",
        "risk": "Clopidogrel 需經 CYP2C19 代謝才有活性。併服 Esomeprazole 會導致 Clopidogrel 療效大幅降低，增加心血管血栓風險。",
        "planB": "（關鍵考點）不能只說「不能用 PPI」，而要精準提出：改用對 CYP2C19 幾乎無影響的 Pantoprazole（保衛康），或改用 H2-blocker（如 Famotidine）。",
        "chips": [
          "若藥師未發現而照發藥品，後續將引發心肌梗塞，扣除綠籌碼（健康度）5 枚。",
          "若成功提出 Pantoprazole 的精確替代方案，因藥價可能微幅變動，扣除紅籌碼（藥費）2 枚。"
        ]
      }
    }
  ]
}/*SEED_END*/;
</script>

        重新整理網頁後，學生版、老師後台、抽卡畫面都會同步更新，你完全不用碰程式碼，也不用一個一個貼連結。

<!-- 抽卡結果彈窗 -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closePop()">
  <div class="card-pop" id="cardPop"></div>
</div>

<script>
/* =================== 資料與工具 =================== */
const DATA = window.GAME_DATA;
const STAR_LABELS = {1:"★",2:"★★",3:"★★★",4:"★★★★",5:"★★★★★",special:"特殊狀況"};
const STARS = [1,2,3,4,5,"special"];
let selectedStar = 1;
let pool = {role:[], case:{}}; // 已抽走的 id
function baseUrl(){ return (DATA.config.baseUrl || (location.origin+location.pathname)); }
function studentUrl(type,id){ return baseUrl()+"?view=student&type="+type+"&id="+encodeURIComponent(id); }
function casesByStar(s){ return DATA.cases.filter(c=>String(c.star)===String(s)); }
function findCase(id){ return DATA.cases.find(c=>c.id===id); }
function findRole(id){ return DATA.roles.find(r=>r.id===id); }
function esc(t){ return (t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* =================== 檢視切換 =================== */
function showView(v){
  document.querySelectorAll(".view").forEach(el=>el.classList.remove("on"));
  const el=document.getElementById("view-"+v); if(el) el.classList.add("on");
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.v===v));
  window.scrollTo(0,0);
  if(v==="teacher") renderTeacherList();
  if(v==="editor") renderEditor();
}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>showView(b.dataset.v));

/* =================== 首頁遊戲介紹 =================== */
function renderIntro(){
  const box=document.getElementById("introPanel"); if(!box) return;
  const cfg=DATA.config||{};
  const rules=(cfg.rules||[]).map(sec=>`<div class="rh">${esc(sec.h)}</div>
    <ul>${(sec.items||[]).map(it=>`<li>${esc(it)}</li>`).join("")}</ul>`).join("");
  const roleTabs=(DATA.roles||[]).map((r,i)=>`<button type="button" class="role-tab${i===0?" on":""}" data-i="${i}" onclick="roleShow(this)">${esc(r.name)}</button>`).join("");
  const rolePanels=(DATA.roles||[]).map((r,i)=>`<div class="role-panel" data-i="${i}" style="display:${i===0?"flex":"none"}">
      ${r.img?`<img src="${r.img}" alt="${esc(r.name)}">`:""}
      <div class="rp-body">
        <div class="rp-name">${esc(r.name)}<span class="eng">${esc(r.en||"")}</span></div>
        <div class="field"><div class="k">職責</div><div class="v">${esc(r.duty)}</div></div>
        <div class="field"><div class="k">核心思考</div><div class="v">${esc(r.core)}</div></div>
        <div class="field"><div class="k">行動指引</div><div class="v">${esc(r.guide)}</div></div>
        <div class="field"><div class="k">💬 對話起手式</div><div class="v">${esc(r.opener)}</div></div>
      </div></div>`).join("");
  box.innerHTML=`
    <div class="intro-hero"><div class="cn">${esc(cfg.title||"醫藥先鋒：藥師任務地圖")}</div>
      <div class="tag">${esc(cfg.tagline||"")}</div></div>
    <details class="collap" style="margin-top:14px"><summary>遊戲規則說明</summary>
      <div class="inner rules-block">${rules}</div></details>
    <div class="rh" style="font-weight:900;color:var(--green-d);font-size:14px;margin:18px 0 2px;display:flex;align-items:center;gap:7px">
      <span style="width:5px;height:15px;background:var(--green);border-radius:3px;display:inline-block"></span>角色介紹（點按鈕看各角色）</div>
    <div class="role-block">
      <div class="role-tabs">${roleTabs}</div>
      ${rolePanels}
    </div>`;
}
function roleShow(btn){
  const box=btn.closest(".role-block"); if(!box) return;
  const i=btn.dataset.i;
  box.querySelectorAll(".role-tab").forEach(b=>b.classList.toggle("on", b===btn));
  box.querySelectorAll(".role-panel").forEach(p=>{ p.style.display=(p.dataset.i===i)?"flex":"none"; });
}

/* =================== 首頁遊戲介紹 end =================== */
function renderStars(){
  const box=document.getElementById("starPicker"); box.innerHTML="";
  STARS.forEach(s=>{
    const b=document.createElement("button");
    b.className="star-btn"+(s==="special"?" special":"")+(String(s)===String(selectedStar)?" sel":"");
    b.textContent=STAR_LABELS[s];
    b.onclick=()=>{selectedStar=s; renderStars();};
    box.appendChild(b);
  });
}

/* =================== 抽卡邏輯 =================== */
function drawRole(){
  const avail=DATA.roles.filter(r=>!pool.role.includes(r.id));
  if(avail.length===0){ alert("角色卡已抽完，請按「角色卡重新洗牌」再抽。"); return; }
  const r=avail[Math.floor(Math.random()*avail.length)];
  pool.role.push(r.id);
  popRole(r);
}
function drawCase(){
  const list=casesByStar(selectedStar);
  if(list.length===0){ alert("這個星級目前還沒有題目，你可以到「題目編輯器」新增。"); return; }
  const key=String(selectedStar);
  pool.case[key]=pool.case[key]||[];
  const avail=list.filter(c=>!pool.case[key].includes(c.id));
  if(avail.length===0){ alert("這個星級的題目都抽完了，請按「狀況題重新洗牌」再抽。"); return; }
  const c=avail[Math.floor(Math.random()*avail.length)];
  pool.case[key].push(c.id);
  popCase(c);
}
function reshuffle(kind){
  if(kind==="role"){ pool.role=[]; alert("角色卡已重新洗牌，三個角色都可以再抽了。"); }
  else{ pool.case={}; alert("狀況題已重新洗牌，所有星級的題目都回到牌庫了。"); }
}

/* =================== 彈窗：角色卡 / 狀況卡 =================== */
function qrInto(el,url){
  el.innerHTML="";
  try{ new QRCode(el,{text:url,width:150,height:150,correctLevel:QRCode.CorrectLevel.M}); }
  catch(e){ el.innerHTML='<div class="qr-fallback">QR 元件未載入，學生版網址：<br>'+esc(url)+'</div>'; }
}
function openPop(){ document.getElementById("overlay").classList.add("on"); }
function closePop(){ document.getElementById("overlay").classList.remove("on"); }

function popRole(r){
  const pop=document.getElementById("cardPop");
  pop.innerHTML=`
    <div class="card-pop-head role">
      <div><div class="code eng">${esc(r.en||"")}</div><h3>${esc(r.name)}　角色卡</h3></div>
      <button class="close" onclick="closePop()">×</button>
    </div>
    <div class="card-pop-body">
      <div>${r.img?`<img class="card-img" src="${r.img}" alt="${esc(r.name)}">`:""}</div>
      <div>
        <div class="field"><div class="k">你的職責</div><div class="v">${esc(r.duty)}</div></div>
        <div class="field"><div class="k">核心思考</div><div class="v">${esc(r.core)}</div></div>
        <div class="field"><div class="k">行動指引</div><div class="v">${esc(r.guide)}</div></div>
        <div class="field"><div class="k">💬 對話起手式</div><div class="v">${esc(r.opener)}</div></div>
        <div class="qr-box"><div id="qrRole"></div><div class="lbl">學生掃描看角色任務</div></div>
      </div>
    </div>`;
  openPop(); qrInto(document.getElementById("qrRole"), studentUrl("role",r.id));
}

/* 院內藥品資訊（學生 + 老師共用） */
function findDrug(id){ return (DATA.drugs||[]).find(d=>d.id===id); }
function renderDrugInfo(c){
  const di=c.student&&c.student.drugInfo; if(!di||!di.drugs||!di.drugs.length) return "";
  const flds=(di.fields&&di.fields.length)?di.fields:["中文適應症","用藥方法","禁忌症"];
  const drugs=di.drugs.map(x=>findDrug(x)||(DATA.drugs||[]).find(d=>d["藥品學名"]===x)).filter(Boolean);
  if(!drugs.length||!flds.length) return "";
  const first=flds[0];
  const tabs=flds.map((f,i)=>`<button type="button" class="dc-tab${i===0?" on":""}" data-f="${esc(f)}" onclick="dcSwitch(this)">${esc(f)}</button>`).join("");
  const rows=drugs.map(d=>{
    const cells=flds.map(f=>{
      const raw=d[f]&&String(d[f]).trim();
      const v=raw?esc(String(d[f])):"（無資料）";
      return `<div class="dc-cell${raw?"":" empty"}" data-f="${esc(f)}" style="display:${f===first?"block":"none"}">${v}</div>`;
    }).join("");
    return `<tr><td class="dc-drug">${esc(d["中文名稱"]||d["藥品學名"]||"")}<span>${esc(d["藥品學名"]||"")}</span></td><td class="dc-val">${cells}</td></tr>`;
  }).join("");
  return `<div class="drug-sec"><div class="head">🏥 院內藥品資訊（點上方欄位比較各藥）</div>
    <div class="drug-compare">
      <div class="dc-tabs">${tabs}</div>
      <table class="dc-table"><tbody>${rows}</tbody></table>
    </div></div>`;
}
function dcSwitch(btn){
  const box=btn.closest(".drug-compare"); if(!box) return;
  const f=btn.dataset.f;
  box.querySelectorAll(".dc-tab").forEach(b=>b.classList.toggle("on", b===btn));
  box.querySelectorAll(".dc-cell").forEach(c=>{ c.style.display=(c.dataset.f===f)?"block":"none"; });
}
function renderInteractions(c){
  if(!c.interactions||!c.interactions.length) return "";
  const rows=c.interactions.map(i=>`<tr><td>${esc(i.drugs)}</td>
    <td class="sev ${(i.sev||'').toLowerCase()}">${esc(i.sev)}</td>
    <td>${esc(i.doc||'')}</td><td>${esc(i.summary||'')}</td></tr>`).join("");
  return `<div class="drug-sec"><div class="head">🔬 藥物交互作用</div>
    <table class="itable"><tr><th>藥物</th><th>嚴重性</th><th>文件</th><th>綜述</th></tr>${rows}</table></div>`;
}

function popCase(c){
  const s=c.student, pop=document.getElementById("cardPop");
  const starTxt = STAR_LABELS[c.star]||"";
  pop.innerHTML=`
    <div class="card-pop-head">
      <div><div class="code eng">${esc(c.code)} · ${esc(starTxt)}</div><h3>${esc(c.title)}</h3></div>
      <button class="close" onclick="closePop()">×</button>
    </div>
    <div class="card-pop-body">
      <div>
        <div class="field"><div class="k">病人資訊</div><div class="v">${esc(s.patient)}</div></div>
        <div class="field"><div class="k">初始情境</div><div class="v">${esc(s.context)}</div></div>
        <div class="field"><div class="k">醫師處方</div><div class="v">${esc(s.rx)}</div></div>
        ${renderInteractions(c)}
        ${renderDrugInfo(c)}
        ${s.evidence?`<details class="collap"><summary>臨床實證參考</summary><div class="inner">${esc(s.evidence)}</div></details>`:""}
        ${(s.refs&&s.refs.length)?`<details class="collap"><summary>延伸文獻</summary><div class="inner">${s.refs.map(r=>`<a class="ref-link" href="${r.url}" target="_blank">${esc(r.title)}</a>`).join("<br>")}</div></details>`:""}
      </div>
      <div>
        <div class="qr-box"><div id="qrCase"></div><div class="lbl">學生掃描看完整情境</div></div>
      </div>
    </div>`;
  openPop(); qrInto(document.getElementById("qrCase"), studentUrl("case",c.id));
}

/* =================== 學生版頁面 =================== */
function starLine(star){
  if(star==="special") return "特殊狀況";
  return "★".repeat(Number(star));
}
function renderStudent(type,id){
  document.querySelector(".topbar").style.display="none";
  const wrap=document.querySelector(".wrap");
  if(type==="role"){
    const r=findRole(id);
    if(!r){ wrap.innerHTML="<div class='empty'>找不到這張角色卡。</div>"; return; }
    wrap.innerHTML=`<div class="student-page">
      <div class="stu-hero"><div class="code eng">${esc(r.en||"ROLE")}</div><h1>${esc(r.name)}</h1></div>
      <div class="stu-card">
        <div class="field"><div class="k">你的職責</div><div class="v">${esc(r.duty)}</div></div>
        <div class="field"><div class="k">核心思考</div><div class="v">${esc(r.core)}</div></div>
        <div class="field"><div class="k">行動指引</div><div class="v">${esc(r.guide)}</div></div>
        <div class="field"><div class="k">💬 對話起手式</div><div class="v">${esc(r.opener)}</div></div>
      </div></div>`;
    return;
  }
  const c=findCase(id);
  if(!c){ wrap.innerHTML="<div class='empty'>找不到這張狀況卡。</div>"; return; }
  const s=c.student;
  wrap.innerHTML=`<div class="student-page">
    <div class="stu-hero"><div class="code eng">${esc(c.code)}</div><h1>${esc(c.title)}</h1>
      <div class="starline">${starLine(c.star)}</div></div>
    <div class="stu-card">
      <div class="field"><div class="k">病人資訊</div><div class="v">${esc(s.patient)}</div></div>
      <div class="field"><div class="k">初始情境</div><div class="v">${esc(s.context)}</div></div>
      <div class="field"><div class="k">醫師處方</div><div class="v">${esc(s.rx)}</div></div>
      ${renderInteractions(c)}
      ${renderDrugInfo(c)}
      ${s.evidence?`<details class="collap"><summary>臨床實證參考</summary><div class="inner">${esc(s.evidence)}</div></details>`:""}
      ${(s.refs&&s.refs.length)?`<details class="collap"><summary>延伸文獻</summary><div class="inner">${s.refs.map(r=>`<a class="ref-link" href="${r.url}" target="_blank">${esc(r.title)}</a>`).join("<br>")}</div></details>`:""}
    </div></div>`;
}

/* =================== 老師後台：總覽 =================== */
function renderTeacherList(){
  document.getElementById("teacherDetail").style.display="none";
  const box=document.getElementById("teacherList"); box.style.display="block";
  let html=`<div class="enter-editor"><button onclick="showView('editor')">✏️ 進入題目編輯器</button></div>`;
  html+=`<div class="panel"><div class="tb-section-title"><span class="bar"></span>角色卡</div><div class="role-grid">`;
  DATA.roles.forEach(r=>{
    html+=`<div class="mini-card" onclick="teacherRole('${r.id}')">
      ${r.img?`<img src="${r.img}" alt="">`:`<div style="aspect-ratio:.7;display:flex;align-items:center;justify-content:center;background:rgba(74,124,89,.1)">🧑‍⚕️</div>`}
      <div class="mc-name">${esc(r.name)}</div></div>`;
  });
  html+=`</div></div>`;
  html+=`<div class="panel"><div class="tb-section-title"><span class="bar"></span>狀況題（點入看含答案的完整版）</div>`;
  STARS.forEach(s=>{
    const list=casesByStar(s); if(list.length===0) return;
    html+=`<div class="star-group"><h4>${STAR_LABELS[s]}</h4>`;
    list.forEach(c=>{
      html+=`<div class="case-row" onclick="teacherCase('${c.id}')">

        <span class="answer-flag">🔑 含解答</span><span class="go">›</span></div>`;
    });
    html+=`</div>`;
  });
  if(DATA.cases.length===0) html+=`<div class="empty">還沒有任何狀況題，到「題目編輯器」新增第一題吧。</div>`;
  html+=`</div>`;
  box.innerHTML=html;
}

/* =================== 編輯器 =================== */
let edMode="cases";
function edTab(m){ edMode=m;
  document.querySelectorAll(".ed-tabs button").forEach(b=>b.classList.toggle("on",b.dataset.et===m));
  document.getElementById("edCases").style.display=m==="cases"?"block":"none";
  document.getElementById("edRoles").style.display=m==="roles"?"block":"none";
  document.getElementById("edDrugs").style.display=m==="drugs"?"block":"none";
  renderEditor();
}
function renderDrugsTab(){
  const box=document.getElementById("edDrugs");
  box.innerHTML=`
    <label style="display:block;font-weight:700;color:var(--green-d);margin-bottom:6px">從 Excel 匯入藥品資料庫</label>
    <input type="file" accept=".xlsx,.xls" id="drugXlsx" onchange="importDrugsXlsx(event)">
    <div class="note" style="margin-top:10px">選擇你的藥品 Excel（第一列是欄位名稱、每列一支藥、第一欄是藥品學名）。匯入會用新檔覆蓋整份藥品資料庫，各狀況題原本勾選的藥品若學名一致會自動接上。匯入後記得按下方「匯出 data.js」保存。</div>
    <div style="margin-top:16px;font-weight:700;color:var(--green-d)">目前資料庫：${(DATA.drugs||[]).length} 支藥、${(DATA.fields||[]).length} 個欄位</div>
    <div class="ed-list" style="margin-top:10px">${(DATA.drugs||[]).map(d=>`
      <div class="drug-db-item"><span class="dn">${esc(d["中文名稱"]||"")}</span>
        <span class="de">${esc(d["藥品學名"]||"")}</span></div>`).join("")}</div>`;
}
function importDrugsXlsx(e){
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=(ev)=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:"array"});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
      const headers=rows[0].map(h=>String(h).trim()).filter(Boolean);
      const drugs=[];
      let n=0;
      rows.slice(1).forEach(r=>{
        if(!r.some(c=>String(c).trim())) return;
        n++; const d={id:"drug-"+String(n).padStart(2,"0")};
        headers.forEach((h,i)=>{ d[h]=r[i]==null?"":String(r[i]).trim(); });
        drugs.push(d);
      });
      DATA.fields=headers; DATA.drugs=drugs;
      alert("匯入成功：共 "+drugs.length+" 支藥、"+headers.length+" 個欄位。別忘了按「匯出 data.js」保存。");
      renderDrugsTab();
    }catch(err){ alert("匯入失敗，請確認是有效的 Excel 檔。\n"+err.message); }
  };
  rd.readAsArrayBuffer(f);
}
function renderEditor(){
  // 狀況題清單
  const ec=document.getElementById("edCases");
  ec.innerHTML=`<button class="btn-save" onclick="edNewCase()">＋ 新增狀況題</button><div class="ed-list">`+
    DATA.cases.map(c=>`<div class="ed-item"><span class="code">${esc(c.code)}</span>
      <span class="grow">${esc(c.title)}</span><span style="color:var(--gold-d)">${STAR_LABELS[c.star]}</span>
      <button class="btn-edit" onclick="edEditCase('${c.id}')">編輯</button>
      <button class="btn-del" onclick="edDelCase('${c.id}')">刪除</button></div>`).join("")+`</div>`;
  // 角色卡清單
  const er=document.getElementById("edRoles");
  er.innerHTML=`<button class="btn-save" onclick="edNewRole()">＋ 新增角色卡</button><div class="ed-list">`+
    DATA.roles.map(r=>`<div class="ed-item"><span class="grow">${esc(r.name)}</span>
      <span class="code">${esc(r.en||"")}</span>
      <button class="btn-edit" onclick="edEditRole('${r.id}')">編輯</button>
      <button class="btn-del" onclick="edDelRole('${r.id}')">刪除</button></div>`).join("")+`</div>`;
  // 藥品資料庫
  renderDrugsTab();
}
function edField(label,val,ml){ return `<label>${label}</label>${ml?`<textarea id="f_${label}">${esc(val||"")}</textarea>`:`<input id="f_${label}" value="${esc(val||"")}">`}`; }

function edNewCase(){ edCaseForm(null); }
function edEditCase(id){ edCaseForm(findCase(id)); }
function edCaseForm(c){
  const isNew=!c; c=c||{student:{},teacher:{}};
  const s=c.student||{}, t=c.teacher||{};
  const ec=document.getElementById("edCases");
  ec.innerHTML=`<button class="back-link" onclick="renderEditor()">‹ 回清單</button>
   <div class="form">
    <div class="row2">
      <div>${edField("卡號",c.code)}</div>
      <div><label>星級</label><select id="f_star">${STARS.map(x=>`<option value="${x}" ${String(x)===String(c.star)?"selected":""}>${STAR_LABELS[x]}</option>`).join("")}</select></div>
    </div>
    ${edField("標題",c.title)}
    <div class="tb-section-title" style="font-size:15px;margin-top:18px"><span class="bar"></span>學生看得到</div>
    ${edField("病人資訊",s.patient,1)}
    ${edField("初始情境",s.context,1)}
    ${edField("醫師處方",s.rx,1)}
    <label>院內藥品資訊：這題要掛哪幾支藥（可複選）</label>
    <input type="text" placeholder="🔍 輸入藥名或學名搜尋（例如 esome、耐適恩）" oninput="drugFilter(this.value)" style="margin-bottom:8px">
    <div class="checkgrid" id="drugPick">${(DATA.drugs||[]).map(d=>{
      const key=d["藥品學名"]||d.id;
      const on=(s.drugInfo&&s.drugInfo.drugs||[]).includes(key);
      const sTxt=esc((d["中文名稱"]||"")+" "+(d["藥品學名"]||""));
      return `<label data-s="${sTxt}"><input type="checkbox" value="${esc(key)}" ${on?"checked":""}> ${esc(d["中文名稱"]||"")} <span style="color:var(--ink-soft);font-size:12px">${esc(d["藥品學名"]||"")}</span></label>`;
    }).join("")||'<span style="color:var(--ink-soft)">尚無藥品，請先到「藥品資料庫」匯入 Excel。</span>'}</div>
    <label>這題要聚焦顯示哪些欄位（可複選，只勾這題想強調的）</label>
    <div class="checkgrid cols" id="fieldPick">${(DATA.fields||[]).map(f=>{
      const dflt=["中文適應症","成人常用劑量說明","用藥方法","禁忌症","貯藏方式"];
      const cur=(s.drugInfo&&s.drugInfo.fields)|| (isNew?dflt:[]);
      const on=cur.includes(f);
      return `<label><input type="checkbox" value="${esc(f)}" ${on?"checked":""}> ${esc(f)}</label>`;
    }).join("")}</div>
    ${edField("臨床實證參考",s.evidence,1)}
    ${edField("延伸文獻標題",(s.refs&&s.refs[0])?s.refs[0].title:"")}
    ${edField("延伸文獻連結",(s.refs&&s.refs[0])?s.refs[0].url:"")}
    <div class="tb-section-title" style="font-size:15px;margin-top:18px;color:var(--red-d)"><span class="bar" style="background:var(--red)"></span>只有老師看得到</div>
    ${edField("專業審核",t.review,1)}
    ${edField("風險警告",t.risk,1)}
    ${edField("替代建議 B計畫",t.planB,1)}
    ${edField("籌碼操作（每行一條）",(t.chips||[]).join("\n"),1)}
    <div class="ed-actions">
      <button class="btn-save" onclick="edSaveCase('${isNew?"":c.id}')">儲存</button>
      <button class="btn-ghost" onclick="renderEditor()">取消</button>
    </div>
   </div>`;
}
function gv(l){ const el=document.getElementById("f_"+l); return el?el.value.trim():""; }
function pickVals(boxId){ return [...document.querySelectorAll("#"+boxId+" input:checked")].map(x=>x.value); }
function drugFilter(q){
  q=(q||"").trim().toLowerCase();
  document.querySelectorAll("#drugPick label").forEach(l=>{
    const t=(l.dataset.s||"").toLowerCase();
    l.style.display=(!q||t.indexOf(q)>=0)?"flex":"none";
  });
}
function edSaveCase(id){
  const prev=findCase(id);
  const obj={
    id:id||("case-"+Date.now()), code:gv("卡號")||"CASE", title:gv("標題")||"未命名",
    star:(function(v){return v==="special"?"special":Number(v);})(document.getElementById("f_star").value),
    student:{ patient:gv("病人資訊"),context:gv("初始情境"),rx:gv("醫師處方"),evidence:gv("臨床實證參考"),
      refs: gv("延伸文獻連結")?[{title:gv("延伸文獻標題")||gv("延伸文獻連結"),url:gv("延伸文獻連結")}]:[],
      drugInfo:{ drugs:pickVals("drugPick"), fields:pickVals("fieldPick") } },
    interactions:(prev&&prev.interactions)||[],
    teacher:{ review:gv("專業審核"),risk:gv("風險警告"),planB:gv("替代建議 B計畫"),
      chips: gv("籌碼操作（每行一條）").split("\n").map(x=>x.trim()).filter(Boolean) }
  };
  if(id){ const i=DATA.cases.findIndex(c=>c.id===id); DATA.cases[i]=obj; }
  else DATA.cases.push(obj);
  renderEditor();
}
function edDelCase(id){ if(confirm("確定刪除這題？")){ DATA.cases=DATA.cases.filter(c=>c.id!==id); renderEditor(); } }

function edNewRole(){ edRoleForm(null); }
function edEditRole(id){ edRoleForm(findRole(id)); }
function edRoleForm(r){
  const isNew=!r; r=r||{};

  er.innerHTML=`<button class="back-link" onclick="renderEditor()">‹ 回清單</button>

function edRoleImg(e){
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader(); rd.onload=()=>{ edRoleForm._img=rd.result;
    document.getElementById("imgPrev").innerHTML=`<img src="${rd.result}" style="width:120px;border-radius:12px">`; };
  rd.readAsDataURL(f);
}
function edSaveRole(id){
  const obj={ id:id||("role-"+Date.now()), name:gv("角色名稱")||"新角色", en:gv("英文副標"),
    duty:gv("職責"),core:gv("核心思考"),guide:gv("行動指引"),opener:gv("對話起手式"),
    img:edRoleForm._img||(findRole(id)&&findRole(id).img)||"" };
  if(id){ const i=DATA.roles.findIndex(r=>r.id===id); DATA.roles[i]=obj; }
  else DATA.roles.push(obj);
  renderEditor();
}
function edDelRole(id){ if(confirm("確定刪除這個角色？")){ DATA.roles=DATA.roles.filter(r=>r.id!==id); renderEditor(); } }

function exportData(){
  const txt="window.GAME_DATA = "+JSON.stringify(DATA,null,2)+";\n";
  const blob=new Blob([txt],{type:"text/javascript"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="data.js"; a.click();
}

/* =================== 啟動 =================== */
(function init(){
  const p=new URLSearchParams(location.search);
  const view=p.get("view");
  if(view==="student"){ renderStudent(p.get("type"),p.get("id")); return; }
  renderStars();
  renderIntro();
  if(view==="teacher"){ showView("teacher"); }
  else if(view==="editor"){ showView("editor"); }
})();
</script>
